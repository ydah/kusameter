name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Check tag against gem version
        run: test "$GITHUB_REF_NAME" = "v$(ruby -Ilib -rkusameter/version -e 'print Kusameter::VERSION')"
      - run: bundle exec rake
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - run: gem build kusameter.gemspec
      - run: gem push kusameter-*.gem
